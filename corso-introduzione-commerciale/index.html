<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SSI Start – corso agenti</title>
<meta name="theme-color" content="#0b5d63">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SSI Start">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;600;700&family=Raleway:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: indice moduli a sinistra (a scomparsa su telefono), colonna di lettura a destra. Colori del marchio SSI: petrolio + giallo. */
:root{
  --bg:#f6f8f8; --paper:#ffffff; --ink:#15302f; --ink-2:#4a6563; --line:#d8e3e2;
  --teal:#0f8c91; --teal-deep:#0b5d63; --teal-soft:#e3f2f2; --sun:#f3c316; --sun-soft:#fdf4cf;
  --ok:#1f8a4c; --ok-soft:#e1f4e8; --warn:#b4540c; --warn-soft:#fbeadb; --bad:#b3261e; --bad-soft:#fbe4e2;
  --f-display:"Josefin Sans","Avenir Next","Trebuchet MS",sans-serif;
  --f-body:"Raleway","Segoe UI","Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1a1b; --paper:#142425; --ink:#e4efee; --ink-2:#9fb7b5; --line:#27403f;
  --teal:#4cc3c6; --teal-deep:#7fd6d8; --teal-soft:#16393b; --sun:#f3c93a; --sun-soft:#3a3214;
  --ok:#5cc98a; --ok-soft:#173526; --warn:#f0a35e; --warn-soft:#3b2716; --bad:#f08a82; --bad-soft:#3e1d1b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1a1b; --paper:#142425; --ink:#e4efee; --ink-2:#9fb7b5; --line:#27403f;
  --teal:#4cc3c6; --teal-deep:#7fd6d8; --teal-soft:#16393b; --sun:#f3c93a; --sun-soft:#3a3214;
  --ok:#5cc98a; --ok-soft:#173526; --warn:#f0a35e; --warn-soft:#3b2716; --bad:#f08a82; --bad-soft:#3e1d1b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--f-body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--teal-deep)}
a{color:var(--teal-deep)} a:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.15;margin:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--teal-deep);color:#fff;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:1.15rem;letter-spacing:.02em}
.brand .mark{width:30px;height:30px;border-radius:7px;background:var(--sun);color:#0b5d63;display:grid;place-items:center;font-size:1.1rem}
.prog{flex:1;min-width:160px;display:flex;align-items:center;gap:10px;font-size:.85rem}
.bar{flex:1;height:8px;border-radius:99px;background:rgba(255,255,255,.22);overflow:hidden}
.bar i{display:block;height:100%;background:var(--sun);width:0;transition:width .4s}
.menu-btn{display:none;background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:8px;padding:6px 10px;font:600 .85rem var(--f-body);cursor:pointer}
.wrap{display:grid;grid-template-columns:300px minmax(0,1fr);max-width:1240px;margin:0 auto;gap:0}
nav.idx{position:sticky;top:calc(env(safe-area-inset-top,0px) + 52px);align-self:start;max-height:calc(100vh - 60px);overflow:auto;padding:22px 16px 30px max(16px,env(safe-area-inset-left,0px));border-right:1px solid var(--line)}
nav.idx h4{font:600 .72rem var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);margin:14px 6px 6px}
.mod-link{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;background:transparent;border:0;border-radius:10px;padding:8px 8px;color:var(--ink);cursor:pointer;font:500 .92rem/1.3 var(--f-body)}
.mod-link:hover:not([disabled]){background:var(--teal-soft)}
.mod-link[aria-current="true"]{background:var(--teal-soft);font-weight:700}
.mod-link[disabled]{color:var(--ink-2);cursor:not-allowed;opacity:.7}
.mod-link .num{font:700 .9rem var(--f-display);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);color:var(--ink-2)}
.mod-link.done .num{background:var(--ok);border-color:var(--ok);color:#fff}
.mod-link.open .num{border-color:var(--teal);color:var(--teal-deep)}
.mod-link .st{font-size:.75rem;color:var(--ink-2);font-variant-numeric:tabular-nums}
main{padding-block:28px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.col{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:26px}
.eyebrow{font:600 .75rem var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--teal)}
.hero{display:flex;flex-direction:column;gap:12px;padding-bottom:18px;border-bottom:3px solid var(--sun)}
.hero h1{font-size:clamp(1.9rem,4.2vw,2.7rem);font-weight:700;color:var(--teal-deep)}
.hero p.sub{font-size:1.1rem;color:var(--ink-2);margin:0;max-width:62ch}
.meta{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:600 .78rem var(--f-body);padding:4px 10px;border-radius:99px;background:var(--teal-soft);color:var(--teal-deep)}
.chip.r-basso{background:var(--ok-soft);color:var(--ok)} .chip.r-medio{background:var(--sun-soft);color:var(--warn)} .chip.r-alto{background:var(--bad-soft);color:var(--bad)}
section.blk{display:flex;flex-direction:column;gap:10px}
section.blk h2{font-size:1.45rem;color:var(--ink)}
section.blk h3{font-size:1.1rem;margin-top:6px}
.prose p{margin:0 0 .7em;max-width:68ch} .prose ul,.prose ol{margin:0 0 .7em;padding-left:1.3em;max-width:68ch} .prose li{margin:.2em 0}
.prose strong{color:var(--teal-deep)}
.obj{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.obj ul{margin:6px 0 0;padding-left:1.2em}
.box{border-radius:12px;padding:14px 16px 6px;border:1px solid var(--line);background:var(--paper)}
.box .bh{font:700 .78rem var(--f-body);letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px;display:flex;gap:8px;align-items:center}
.box.norma{border-left:5px solid var(--teal)} .box.norma .bh{color:var(--teal-deep)}
.box.attenzione{background:var(--warn-soft);border-color:transparent} .box.attenzione .bh{color:var(--warn)}
.box.vendita{background:var(--sun-soft);border-color:transparent} .box.vendita .bh{color:var(--ink)}
.box.caso{background:var(--teal-soft);border-color:transparent} .box.caso .bh{color:var(--teal-deep)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:700 .74rem var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);background:var(--teal-soft)}
tr:last-child td{border-bottom:0}
td.cod{font-family:var(--f-mono);font-size:.82rem;white-space:nowrap;color:var(--teal-deep)}
td.pr{white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:700;text-align:right}
.note-pr{font-size:.8rem;color:var(--ink-2)}
ol.ask{counter-reset:q;list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
ol.ask li{counter-increment:q;display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
ol.ask li::before{content:counter(q);font:700 .9rem var(--f-display);color:var(--teal-deep);background:var(--teal-soft);border-radius:50%;width:28px;height:28px;display:grid;place-items:center}
.vids{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.vid{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--paper);text-decoration:none;color:var(--ink)}
.vid:hover{border-color:var(--teal)}
.vid b{font-size:.95rem;line-height:1.3} .vid span{font-size:.8rem;color:var(--ink-2)}
.vid .play{font:700 .72rem var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--bad)}
.fonti{font-size:.85rem;color:var(--ink-2)} .fonti a{word-break:break-word}
/* test */
.quiz{background:var(--paper);border:2px solid var(--teal);border-radius:16px;padding:20px 18px;display:flex;flex-direction:column;gap:16px}
.quiz h2{color:var(--teal-deep)}
.q{display:flex;flex-direction:column;gap:8px;padding-bottom:14px;border-bottom:1px dashed var(--line)}
.q:last-of-type{border-bottom:0}
.q p.qt{margin:0;font-weight:600}
.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--bg)}
.opt input{margin-top:4px;accent-color:var(--teal)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)} .opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.expl{font-size:.88rem;color:var(--ink-2);padding-left:4px}
.btn{font:700 .95rem var(--f-body);border-radius:10px;padding:11px 18px;border:0;cursor:pointer;background:var(--teal-deep);color:#fff}
.btn.sec{background:transparent;color:var(--teal-deep);border:2px solid var(--teal)}
.btn.sun{background:var(--sun);color:#0b3a3e}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.result{border-radius:12px;padding:14px 16px;font-weight:600}
.result.pass{background:var(--ok-soft);color:var(--ok)} .result.fail{background:var(--bad-soft);color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.small{font-size:.84rem;color:var(--ink-2)}
.namebox{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.namebox input{flex:1;min-width:180px;font:500 1rem var(--f-body);padding:9px 11px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:4px}
.card b{font-family:var(--f-display);font-size:1.6rem;color:var(--teal-deep);font-variant-numeric:tabular-nums}
.card span{font-size:.85rem;color:var(--ink-2)}
.bars{display:flex;flex-direction:column;gap:7px}
.hb{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr) 54px;gap:10px;align-items:center;font-size:.88rem}
.hb .t{height:14px;background:var(--teal-soft);border-radius:4px;overflow:hidden}
.hb .t i{display:block;height:100%;background:var(--teal)}
.hb .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.adm{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px}
.pdf{display:inline-flex;gap:8px;align-items:center;font-weight:700;text-decoration:none;border:2px solid var(--teal);padding:8px 14px;border-radius:10px}
.navnext{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-top:10px;border-top:1px solid var(--line)}
.lockmsg{padding:30px;text-align:center;border:2px dashed var(--line);border-radius:16px;color:var(--ink-2)}
@media (max-width:900px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  nav.idx{position:fixed;inset:calc(env(safe-area-inset-top,0px) + 52px) 0 0 0;max-height:none;background:var(--bg);z-index:4;border:0;padding-right:max(16px,env(safe-area-inset-right,0px));display:none}
  nav.idx.show{display:block}
  .menu-btn{display:inline-block}
  .hb{grid-template-columns:minmax(0,1fr) 54px} .hb .t{grid-column:1/-1;order:3}
}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
<style>
.login{max-width:440px;margin:48px auto;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:14px}
.login input{font:600 1.15rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.err{color:var(--bad);font-weight:600}
.sync{font-size:.8rem;color:var(--ink-2);padding:2px 8px}
.sync.ko{color:var(--warn)}
.who{font-size:.85rem;opacity:.9}
.who button{background:transparent;border:0;color:#fff;text-decoration:underline;cursor:pointer;font:inherit;padding:0 0 0 6px}
.install{display:none}
</style>
</head>
<body>

<header class="top">
  <button class="menu-btn" id="menuBtn" aria-controls="idx" aria-expanded="false">Moduli</button>
  <div class="brand"><span class="mark" aria-hidden="true">S</span>SSI Start</div>
  <span class="who" id="who"></span><div class="prog"><span id="progTxt">0 di 11</span><div class="bar" aria-hidden="true"><i id="progBar"></i></div></div>
</header>
<div class="wrap">
  <nav class="idx" id="idx" aria-label="Moduli del corso"></nav>
  <main><div class="col" id="view"></div></main>
</div>

<script src="content.js"></script>
<script>
(function(){
const C = window.CORSO;
const MODS = C.moduli;
const PASS = C.soglia; // 0.8
const LSKEY = "ssi-start-app-v1";
let state = {nome:"", moduli:{}};   // moduli[id] = {best, tent, ok, data, letto}
let isOwner=false, db=null, user=null;

function ls(){try{const s=localStorage.getItem(LSKEY); if(s) state=Object.assign(state, JSON.parse(s));}catch(e){}}
function lsSave(){try{localStorage.setItem(LSKEY, JSON.stringify(state));}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function eur(p){return p==null? "a preventivo" : "€ "+Number(p).toLocaleString("it-IT",{minimumFractionDigits: (p%1? 2:0), maximumFractionDigits:2});}

function isUnlocked(i){ if(i===0) return true; const prev=MODS[i-1]; return !!(state.moduli[prev.id]&&state.moduli[prev.id].ok); }
function doneCount(){return MODS.filter(m=>state.moduli[m.id]&&state.moduli[m.id].ok).length;}


const SB_URL = "https://ydoglnodmcuifefnsakt.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlkb2dsbm9kbWN1aWZlZm5zYWt0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0OTI1MzcsImV4cCI6MjEwNDA2ODUzN30.rb7EQ0toTCnuvuSIsAskR3UgmTqLLCCaYDHBAecZSLU";
async function rpc(fn, args){
  const r = await fetch(SB_URL + "/rest/v1/rpc/" + fn, {method:"POST", headers:{"apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY,"Content-Type":"application/json"}, body: JSON.stringify(args)});
  const t = await r.text(); let j = null; try{ j = t ? JSON.parse(t) : null; }catch(e){}
  if(!r.ok){ const err = new Error((j && j.message) || ("HTTP " + r.status)); err.status = r.status; throw err; }
  return j;
}

let codice = null, saveT = null, syncOk = true;
const CODA = LSKEY + "-coda";
function coda(){ try{ return JSON.parse(localStorage.getItem(CODA) || "[]"); }catch(e){ return []; } }
function setCoda(c){ try{ localStorage.setItem(CODA, JSON.stringify(c)); }catch(e){} }
function setSync(ok, txt){ syncOk = ok; const el = document.getElementById("sync"); if(el){ el.className = "sync" + (ok ? "" : " ko"); el.textContent = txt; } }
async function flush(){
  if(!codice) return;
  const c = coda();
  try{
    for(const t of c){ const ok = await rpc("start_salva", {p_codice: codice, p_nome: state.nome || "", p_moduli: state.moduli, p_tentativo: t}); if(ok === false) throw new Error("codice"); c.shift(); setCoda(c); }
    const ok = await rpc("start_salva", {p_codice: codice, p_nome: state.nome || "", p_moduli: state.moduli, p_tentativo: null});
    if(ok === false) throw new Error("codice");
    setSync(true, "Risultati salvati ✓");
  }catch(e){ setSync(false, "Non salvato: riprovo appena torna la connessione"); }
}
function persist(){ lsSave(); clearTimeout(saveT); saveT = setTimeout(flush, 500); }
function txt(h){ const d = document.createElement("div"); d.innerHTML = h; return d.textContent.trim(); }
function inviaTentativo(m, sc, pass, ans){
  const sbagliate = [];
  m.quiz.forEach((q, qi) => { if(ans[qi] !== q.a) sbagliate.push({n: qi + 1, q: txt(q.q), data: txt(q.o[ans[qi]]), giusta: txt(q.o[q.a])}); });
  const c = coda(); c.push({modulo: m.id, punteggio: Math.round(sc * 1000) / 1000, superato: pass, sbagliate}); setCoda(c);
  lsSave(); clearTimeout(saveT); flush();
}
window.addEventListener("online", flush);

const KIT = [["SSI-Prontuario-agente.pdf", "Prontuario tascabile"], ["SSI-Modello-raccolta-dati-compilabile.pdf", "Modello raccolta dati"]];
function renderNav(){
  const nav=document.getElementById("idx");
  let h='<h4>Il percorso</h4>';
  MODS.forEach((m,i)=>{
    const st=state.moduli[m.id]||{}; const un=isUnlocked(i);
    const cls=st.ok?"done":(un?"open":"");
    const lab= st.ok? (Math.round(st.best*100)+"%") : (un? "da fare":"bloccato");
    h+=`<button class="mod-link ${cls}" data-i="${i}" ${un?"":"disabled"} ${cur===i?'aria-current="true"':''}><span class="num">${st.ok?"✓":m.n}</span><span>${esc(m.titoloBreve||m.titolo)}</span><span class="st">${lab}</span></button>`;
  });
  h+='<h4>Materiali</h4>'+KIT.map(k=>`<a class="mod-link open" href="kit/${k[0]}" target="_blank" rel="noopener" style="text-decoration:none"><span class="num">↓</span><span>${esc(k[1])}</span><span class="st">PDF</span></a>`).join('');
  h+='<div class="sync'+(syncOk?'':' ko')+'" id="sync">'+(syncOk?'I risultati si salvano da soli':'Non salvato: riprovo appena torna la connessione')+'</div>';
  nav.innerHTML=h;
  nav.querySelectorAll(".mod-link").forEach(b=>b.addEventListener("click",()=>{const v=b.dataset.i; go(v==="adm"?"adm":+v); nav.classList.remove("show"); document.getElementById("menuBtn").setAttribute("aria-expanded","false");}));
  const d=doneCount();
  document.getElementById("progTxt").textContent=d+" di "+MODS.length+" superati";
  document.getElementById("progBar").style.width=(100*d/MODS.length)+"%";
}

function blk(b){
  if(b.tipo==="testo") return `<section class="blk prose">${b.h?`<h2>${b.h}</h2>`:""}${b.html}</section>`;
  if(b.tipo==="box"){const lab={norma:"Cosa dice la norma",attenzione:"Attenzione",vendita:"Per l'agente",caso:"Caso concreto"}[b.stile]||"";
    return `<div class="box ${b.stile} prose"><div class="bh">${b.h||lab}</div>${b.html}</div>`;}
  if(b.tipo==="tabella") return `<section class="blk">${b.h?`<h3>${b.h}</h3>`:""}<div class="tw"><table><thead><tr>${b.cols.map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody>${b.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>${b.nota?`<p class="small">${b.nota}</p>`:""}</section>`;
  if(b.tipo==="barre"){const mx=Math.max(...b.dati.map(d=>d[1]));
    return `<section class="blk"><h3>${b.h}</h3><div class="bars">${b.dati.map(d=>`<div class="hb"><span>${d[0]}</span><span class="t"><i style="width:${(100*d[1]/mx).toFixed(1)}%"></i></span><span class="v">${d[2]||d[1]}</span></div>`).join("")}</div>${b.nota?`<p class="small">${b.nota}</p>`:""}</section>`;}
  if(b.tipo==="cards") return `<section class="blk">${b.h?`<h3>${b.h}</h3>`:""}<div class="cards">${b.dati.map(d=>`<div class="card"><b>${d[0]}</b><span>${d[1]}</span></div>`).join("")}</div></section>`;
  return "";
}

function renderModule(i){
  const m=MODS[i]; const v=document.getElementById("view");
  if(!isUnlocked(i)){v.innerHTML=`<div class="lockmsg"><h2>Modulo bloccato</h2><p>Supera il test del modulo precedente con almeno ${Math.round(PASS*100)}% per aprirlo.</p></div>`;return;}
  const st=state.moduli[m.id]||{};
  let h=`<div class="hero"><div class="eyebrow">${m.n===0?"Introduzione":"Modulo "+m.n} · ${esc(m.durata)}</div><h1>${m.titolo}</h1><p class="sub">${m.sottotitolo}</p>
  <div class="meta">${(m.chips||[]).map(c=>`<span class="chip ${c[1]||""}">${c[0]}</span>`).join("")}</div>
  <div class="row"><a class="pdf" href="${m.pdf}" target="_blank" rel="noopener">Scarica il PDF del modulo</a></div></div>`;
  if(i===0) h+=`<div class="namebox"><label for="nome"><b>Il tuo nome</b> <span class="small">(compare nei risultati che vedono il capo area e la direzione)</span></label><input id="nome" value="${esc(state.nome)}" placeholder="Nome e cognome" autocomplete="name"></div>`;
  h+=`<div class="obj"><b>Alla fine di questo modulo saprai:</b><ul>${m.obiettivi.map(o=>`<li>${o}</li>`).join("")}</ul></div>`;
  h+=m.blocchi.map(blk).join("");
  if(m.proporre&&m.proporre.length){
    h+=`<section class="blk"><h2>Cosa proporre: codici e prezzi</h2><div class="tw"><table><thead><tr><th>Codice</th><th>Servizio</th><th>Quando proporlo</th><th style="text-align:right">Listino</th></tr></thead><tbody>${m.proporre.map(p=>`<tr><td class="cod">${esc(p.cod)}</td><td>${p.desc}</td><td>${p.quando||""}</td><td class="pr">${eur(p.prezzo)}</td></tr>`).join("")}</tbody></table></div><p class="note-pr">Prezzi del listino SisNew in vigore, IVA esclusa. La classe A/B/C la assegna il listino in base al rischio da codice ATECO e alla complessità dell'azienda: nel dubbio, chiedi al tecnico.</p></section>`;
  }
  if(m.domande&&m.domande.length) h+=`<section class="blk"><h2>Le domande da fare al cliente</h2><ol class="ask">${m.domande.map(q=>`<li><span>${q}</span></li>`).join("")}</ol></section>`;
  if(m.porsi) h+=`<div class="box vendita prose"><div class="bh">Come porti con il cliente</div>${m.porsi}</div>`;
  if(m.caso) h+=`<div class="box caso prose"><div class="bh">Caso concreto · ${m.caso.titolo}</div>${m.caso.html}</div>`;
  if(m.video&&m.video.length) h+=`<section class="blk"><h2>Da guardare</h2><div class="vids">${m.video.map(x=>`<a class="vid" href="${x.url}" target="_blank" rel="noopener"><span class="play">▶ Video · ${esc(x.durata||"")}</span><b>${esc(x.t)}</b><span>${esc(x.canale)} — ${esc(x.perche||"")}</span></a>`).join("")}</div></section>`;
  if(m.fonti&&m.fonti.length) h+=`<details class="fonti"><summary>Fonti e approfondimenti</summary><ul>${m.fonti.map(f=>`<li><a href="${f.url}" target="_blank" rel="noopener">${esc(f.t)}</a></li>`).join("")}</ul></details>`;
  h+=quizHtml(m,st);
  h+=`<div class="navnext">${i>0?`<button class="btn sec" data-go="${i-1}">← Modulo precedente</button>`:"<span></span>"}${i<MODS.length-1?`<button class="btn" data-go="${i+1}" ${isUnlocked(i+1)?"":"disabled"}>${isUnlocked(i+1)?"Modulo successivo →":"Supera il test per proseguire"}</button>`:""}</div>`;
  v.innerHTML=h;
  v.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>go(+b.dataset.go)));
  const n=document.getElementById("nome"); if(n) n.addEventListener("change",()=>{state.nome=n.value.trim(); persist();});
  wireQuiz(m,i);
}

function shuffleIdx(n,seed){const a=[...Array(n).keys()];let s=seed||1;for(let k=n-1;k>0;k--){s=(s*9301+49297)%233280;const j=Math.floor(s/233280*(k+1));[a[k],a[j]]=[a[j],a[k]];}return a;}
function quizHtml(m,st){
  const seed=(st.tent||0)+7;
  let h=`<section class="quiz" id="quiz"><div><div class="eyebrow">Test di passaggio · ${m.quiz.length} domande · soglia ${Math.round(PASS*100)}%</div><h2>Verifica il modulo</h2>${st.ok?`<p class="small">Superato con ${Math.round(st.best*100)}% (${st.tent} tentativ${st.tent===1?"o":"i"}). Puoi rifarlo quando vuoi.</p>`:(st.tent?`<p class="small">Tentativi finora: ${st.tent}. Miglior risultato: ${Math.round((st.best||0)*100)}%.</p>`:"")}</div>`;
  m.quiz.forEach((q,qi)=>{
    const ord=shuffleIdx(q.o.length,seed+qi*13);
    h+=`<fieldset class="q" style="border:0;padding:0;margin:0"><legend class="qt" style="font-weight:600;padding:0;margin-bottom:6px">${qi+1}. ${q.q}</legend>${ord.map(oi=>`<label class="opt" data-q="${qi}" data-o="${oi}"><input type="radio" name="q${qi}" id="q${m.id}_${qi}_${oi}" value="${oi}"><span>${q.o[oi]}</span></label>`).join("")}<div class="expl" hidden id="e${qi}"></div></fieldset>`;
  });
  h+=`<div class="row"><button class="btn sun" id="consegna">Consegna il test</button><span class="small" id="qmsg"></span></div><div id="qres"></div></section>`;
  return h;
}
function wireQuiz(m,i){
  const btn=document.getElementById("consegna");
  btn.addEventListener("click",()=>{
    const ans=m.quiz.map((q,qi)=>{const r=document.querySelector(`input[name="q${qi}"]:checked`);return r?+r.value:null;});
    if(ans.some(a=>a===null)){document.getElementById("qmsg").textContent="Rispondi a tutte le domande prima di consegnare.";return;}
    let ok=0;
    m.quiz.forEach((q,qi)=>{
      const good=ans[qi]===q.a; if(good) ok++;
      document.querySelectorAll(`.opt[data-q="${qi}"]`).forEach(l=>{const o=+l.dataset.o; if(o===q.a) l.classList.add("right"); else if(o===ans[qi]) l.classList.add("wrong"); l.querySelector("input").disabled=true;});
      const e=document.getElementById("e"+qi); e.hidden=false; e.innerHTML=(good?"<b>Giusto.</b> ":"<b>Non è così.</b> ")+q.s;
    });
    const sc=ok/m.quiz.length; const st=state.moduli[m.id]||{tent:0,best:0,ok:false};
    st.tent=(st.tent||0)+1; st.best=Math.max(st.best||0,sc); const pass=sc>=PASS; if(pass){st.ok=true; st.data=new Date().toISOString();}
    st.ultimo=sc; state.moduli[m.id]=st; inviaTentativo(m,sc,pass,ans); renderNav();
    btn.disabled=true; document.getElementById("qmsg").textContent="";
    const nx=i<MODS.length-1;
    document.getElementById("qres").innerHTML=`<div class="result ${pass?"pass":"fail"}">${ok} risposte giuste su ${m.quiz.length} (${Math.round(sc*100)}%). ${pass?(nx?"Test superato: il modulo successivo è aperto.":"Hai completato SSI Start. Complimenti!"):"Non ancora: rileggi le spiegazioni qui sopra e riprova."}</div><div class="row" style="margin-top:10px">${pass&&nx?`<button class="btn" id="avanti">Vai al modulo ${MODS[i+1].n} →</button>`:""}<button class="btn sec" id="rifai">Rifai il test</button></div>`;
    const av=document.getElementById("avanti"); if(av) av.addEventListener("click",()=>go(i+1));
    document.getElementById("rifai").addEventListener("click",()=>{renderModule(i);document.getElementById("quiz").scrollIntoView({behavior:"smooth"});});
    const nb=document.querySelector('.navnext [data-go="'+(i+1)+'"]'); if(nb&&pass){nb.disabled=false;nb.textContent="Modulo successivo →";}
  });
}

async function renderAdmin(){
  const v=document.getElementById("view");
  v.innerHTML=`<div class="hero"><div class="eyebrow">Area direzione e capo area</div><h1>Risultati agenti</h1><p class="sub">Chi ha aperto il corso, quali test ha superato e con che punteggio. Lo vedono solo il titolare della pagina e chi ha accesso come Editor (per esempio il capo area).</p></div><div class="adm" id="admT"><p class="small">Carico i risultati…</p></div>`;
  if(!db){document.getElementById("admT").innerHTML='<p class="small">I risultati condivisi non sono disponibili in questa vista.</p>';return;}
  try{
    const snap=await db.collection("esiti").get();
    if(snap.empty){document.getElementById("admT").innerHTML='<p>Nessun agente ha ancora iniziato. Condividi il corso con l\'agente come <b>Collaboratore</b> (Contributor): così il suo avanzamento viene salvato qui.</p>';return;}
    const ids=snap.docs.map(d=>d.id); let prof={}; try{prof=await user.profiles(ids);}catch(e){}
    let rows=snap.docs.map(d=>{const x=d.data()||{}; const mm=x.moduli||{}; const nm=x.nome||(prof[d.id]&&prof[d.id].name)||"Agente senza nome";
      const cells=MODS.map(m=>{const s=mm[m.id]; return `<td style="text-align:center;font-variant-numeric:tabular-nums">${s?(s.ok?`<b style="color:var(--ok)">${Math.round(s.best*100)}%</b>`:`<span style="color:var(--bad)">${Math.round((s.best||0)*100)}%</span>`):"–"}${s&&s.tent?`<div class="small">${s.tent}×</div>`:""}</td>`;}).join("");
      const ok=MODS.filter(m=>mm[m.id]&&mm[m.id].ok).length;
      return `<tr><td><b>${esc(nm)}</b><div class="small">${x.aggiornato?new Date(x.aggiornato).toLocaleDateString("it-IT"):""}</div></td><td style="text-align:center"><b>${ok}/${MODS.length}</b></td>${cells}</tr>`;}).join("");
    document.getElementById("admT").innerHTML=`<div class="tw"><table><thead><tr><th>Agente</th><th>Superati</th>${MODS.map(m=>`<th style="text-align:center">${m.n===0?"Intro":"M"+m.n}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div><p class="small">Verde = superato (miglior punteggio). Rosso = non ancora superato. Il numero piccolo è quante volte ha fatto il test.</p>`;
  }catch(e){document.getElementById("admT").innerHTML='<p class="small">Non riesco a leggere i risultati in questo momento. Riprova tra poco.</p>';}
}

let cur=0;
function go(i){cur=i; renderNav(); if(i==="adm") renderAdmin(); else renderModule(i); window.scrollTo({top:0}); try{localStorage.setItem(LSKEY+"-cur",String(i));}catch(e){}}

document.getElementById("menuBtn").addEventListener("click",e=>{const n=document.getElementById("idx");n.classList.toggle("show");e.currentTarget.setAttribute("aria-expanded",n.classList.contains("show"));});


function showLogin(msg){
  document.getElementById("idx").innerHTML = ""; document.getElementById("who").textContent = "";
  document.getElementById("view").innerHTML = `<form class="login" id="lf"><h1>Benvenuto in SSI Start</h1><p class="small">Inserisci il codice personale che ti ha dato il capo area. Lo chiediamo una volta sola: i tuoi test vengono salvati e li ritrovi su qualunque dispositivo.</p><label for="cod"><b>Codice agente</b></label><input id="cod" autocomplete="off" autocapitalize="characters" placeholder="SSI-XXXXX" required><button class="btn" type="submit">Entra</button><p class="err" id="lerr" aria-live="polite">${msg||""}</p></form>`;
  document.getElementById("lf").addEventListener("submit", async ev => {
    ev.preventDefault(); const v = document.getElementById("cod").value.trim().toUpperCase(); const e = document.getElementById("lerr"); e.textContent = "Controllo…";
    try{ const r = await rpc("start_login", {p_codice: v}); if(!r){ e.textContent = "Codice non valido. Controlla di averlo scritto bene o chiedilo al capo area."; return; }
      codice = v; try{ localStorage.setItem(LSKEY + "-codice", v); }catch(x){} entra(r);
    }catch(x){ e.textContent = "Non riesco a collegarmi. Controlla la connessione e riprova."; }
  });
}
function entra(r){
  if(r){ const mm = Object.assign({}, r.moduli || {});
    for(const k in state.moduli){ if(!mm[k] || (state.moduli[k].best||0) > (mm[k].best||0) || (state.moduli[k].tent||0) > (mm[k].tent||0)) mm[k] = state.moduli[k]; }
    state.moduli = mm; if(!state.nome) state.nome = r.nome || ""; lsSave(); }
  document.getElementById("who").innerHTML = esc(state.nome || codice) + '<button type="button" id="esci">Esci</button>';
  document.getElementById("esci").addEventListener("click", () => { if(!confirmEsci()) return; try{ localStorage.removeItem(LSKEY); localStorage.removeItem(LSKEY + "-codice"); localStorage.removeItem(LSKEY + "-cur"); localStorage.removeItem(CODA); }catch(x){} location.reload(); });
  let s = 0; try{ const c = localStorage.getItem(LSKEY + "-cur"); if(c !== null && isUnlocked(+c)) s = +c; }catch(e){}
  go(s); flush();
}
function confirmEsci(){ return coda().length === 0 || window.confirm("Alcuni test non sono ancora stati salvati online: se esci li perdi. Vuoi uscire lo stesso?"); }
ls();
try{ codice = localStorage.getItem(LSKEY + "-codice"); }catch(e){}
if(!codice) showLogin();
else { entra(null); rpc("start_login", {p_codice: codice}).then(r => { if(r) entra(r); else { try{ localStorage.removeItem(LSKEY + "-codice"); }catch(x){} codice = null; showLogin("Il tuo codice non è più attivo: chiedi al capo area."); } }).catch(() => setSync(false, "Sei offline: i test si salveranno appena torni online")); }
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
